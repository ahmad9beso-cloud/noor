name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key. Without these secrets the APK is signed with the debug key,
      # which installs fine but cannot be updated over a build signed with a different key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noor.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/noor.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      # Uploads through the website or a zip drop the executable bit of gradlew.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Show APK size
        run: ls -l app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: noor-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
